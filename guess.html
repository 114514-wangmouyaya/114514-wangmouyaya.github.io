<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>猜数字 1-100</title>
  <style>
    *{box-sizing:border-box;font-family:Arial}
    body{max-width:400px;margin:40px auto;padding:0 20px;background:#f5f5f5}
    .box{background:white;padding:30px;border-radius:16px;box-shadow:0 4px 12px #0001}
    h1{text-align:center;color:#333}
    input{width:100%;padding:12px;font-size:16px;border:1px solid #ddd;border-radius:8px;margin:10px 0}
    button{width:100%;padding:12px;background:#4263f6;color:white;border:none;border-radius:8px;font-size:16px;cursor:pointer;margin-top:8px;}
    button:hover{background:#3351e0}
    #resetBtn{background:#28a745;display:none;}
    #resetBtn:hover{background:#218838;}
    .tip{margin:10px 0;font-size:15px;color:#555;height:20px}
    .count{text-align:right;color:#666}
  </style>
</head>
<body>
  <div class="box">
    <h1>猜数字（1-100）</h1>
    <input type="number" id="num" placeholder="请输入数字" min="1" max="100">
    <button id="guessBtn" onclick="guess()">猜一下</button>
    <button id="resetBtn" onclick="resetGame()">重新开始</button>
    <div class="tip" id="tip"></div>
    <div class="count" id="count">次数：0</div>
  </div>

  <script>
    let ans;
    let count = 0;
    const tip = document.getElementById('tip');
    const countDom = document.getElementById('count');
    const numInput = document.getElementById('num');
    const guessBtn = document.getElementById('guessBtn');
    const resetBtn = document.getElementById('resetBtn');

    // 初始化游戏
    function initGame(){
        ans = Math.floor(Math.random()*100)+1;
        count = 0;
        countDom.textContent='次数：0';
        tip.textContent='';
        numInput.value='';
        guessBtn.disabled = false;
        resetBtn.style.display = 'none';
    }

    function guess(){
      const val = parseInt(numInput.value);
      if(!val || val<1 || val>100){
        tip.textContent = '请输入1-100之间的数字';
        tip.style.color='#e64646';
        return;
      }
      count++;
      countDom.textContent='次数：'+count;
      if(val < ans){
        tip.textContent='小了，再大一点';
        tip.style.color='#ff8c00';
      }else if(val > ans){
        tip.textContent='大了，再小一点';
        tip.style.color='#ff8c00';
      }else{
        tip.textContent=`🎉 恭喜猜对！答案是 ${ans}`;
        tip.style.color='#26a655';
        guessBtn.disabled = true;
        resetBtn.style.display = 'block'; //显示重来按钮
      }
    }

    function resetGame(){
        initGame();
    }

    //页面加载初始化
    initGame();
  </script>
</body>
</html>
