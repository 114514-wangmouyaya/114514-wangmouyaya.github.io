<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>听音乐 - 在线音乐播放器</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        html, body { height:100%; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #0f0f1a;
            color: #e8e8f0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ===== 顶部栏 ===== */
        .top-bar {
            padding: 16px 28px;
            background: linear-gradient(180deg, #1a1a2e 0%, #16162a 100%);
            border-bottom: 1px solid #2a2a45;
            flex-shrink: 0;
        }
        .top-row {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }
        .logo-icon {
            width: 38px; height: 38px;
            background: linear-gradient(135deg, #a855f7, #6366f1);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px;
        }
        .logo-area h1 { font-size: 20px; font-weight: 700; white-space: nowrap; }
        .search-box {
            flex: 1;
            max-width: 560px;
            position: relative;
            display: flex;
            gap: 8px;
        }
        .search-box input {
            flex: 1;
            padding: 10px 16px 10px 40px;
            background: #252540;
            border: 1.5px solid #3a3a5c;
            border-radius: 24px;
            color: #e8e8f0;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-box input:focus { border-color: #a855f7; }
        .search-box input::placeholder { color: #6b6b8a; }
        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 14px;
            pointer-events: none;
        }
        .search-btn {
            padding: 10px 24px;
            background: linear-gradient(135deg, #a855f7, #6366f1);
            color: #fff;
            border: none;
            border-radius: 24px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            transition: opacity 0.2s;
        }
        .search-btn:hover { opacity: 0.85; }
        .source-tag {
            font-size: 12px;
            color: #8b8ba7;
            flex-shrink: 0;
        }

        /* ===== 热门搜索 ===== */
        .hot-search {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        .hot-label {
            font-size: 12px;
            color: #6b6b8a;
            flex-shrink: 0;
        }
        .hot-tag {
            padding: 4px 12px;
            background: #252540;
            border: 1px solid #3a3a5c;
            border-radius: 14px;
            font-size: 12px;
            color: #b0b0c8;
            cursor: pointer;
            transition: all 0.15s;
        }
        .hot-tag:hover {
            border-color: #a855f7;
            color: #c084fc;
        }

        /* ===== 歌曲列表 ===== */
        .song-list-container {
            flex: 1;
            overflow-y: auto;
            padding: 10px 28px 20px;
        }
        .list-header {
            display: grid;
            grid-template-columns: 50px 60px 1fr 180px 80px;
            gap: 12px;
            padding: 10px 16px;
            font-size: 12px;
            color: #6b6b8a;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #2a2a45;
            position: sticky;
            top: 0;
            background: #0f0f1a;
            z-index: 1;
        }
        .song-item {
            display: grid;
            grid-template-columns: 50px 60px 1fr 180px 80px;
            gap: 12px;
            align-items: center;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s;
            margin-bottom: 2px;
        }
        .song-item:hover { background: #1e1e38; }
        .song-item.playing { background: rgba(168,85,247,0.12); }
        .song-item.playing .song-title { color: #c084fc; }
        .song-index {
            text-align: center;
            color: #6b6b8a;
            font-size: 14px;
        }
        .song-item.playing .song-index { color: #c084fc; }
        .song-cover {
            width: 44px; height: 44px;
            border-radius: 6px;
            object-fit: cover;
            background: #2a2a45;
        }
        .song-info { min-width: 0; }
        .song-title {
            font-size: 14px;
            color: #e8e8f0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .vip-badge {
            font-size: 10px;
            padding: 1px 5px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #fff;
            border-radius: 3px;
            flex-shrink: 0;
        }
        .song-artist {
            font-size: 12px;
            color: #8b8ba7;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .song-album {
            font-size: 12px;
            color: #8b8ba7;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .song-duration {
            font-size: 13px;
            color: #8b8ba7;
            text-align: right;
        }
        .playing-icon {
            display: inline-flex;
            gap: 2px;
            align-items: flex-end;
            height: 14px;
        }
        .playing-icon span {
            width: 3px;
            background: #c084fc;
            border-radius: 1px;
            animation: wave 1s ease-in-out infinite;
        }
        .playing-icon span:nth-child(1) { height: 8px; animation-delay: 0s; }
        .playing-icon span:nth-child(2) { height: 14px; animation-delay: 0.2s; }
        .playing-icon span:nth-child(3) { height: 10px; animation-delay: 0.4s; }
        @keyframes wave {
            0%,100% { height: 6px; }
            50% { height: 14px; }
        }

        /* 空状态/加载 */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
        }
        .empty-state .icon { font-size: 56px; margin-bottom: 16px; }
        .empty-state h3 { font-size: 18px; color: #c0c0d8; margin-bottom: 8px; }
        .empty-state p { font-size: 14px; color: #6b6b8a; }
        .loading-state {
            text-align: center;
            padding: 60px 20px;
        }
        .spinner {
            width: 40px; height: 40px;
            border: 3px solid #2a2a45;
            border-top-color: #a855f7;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-state p { color: #8b8ba7; font-size: 14px; }

        /* ===== 底部播放栏 ===== */
        .player-bar {
            background: linear-gradient(0deg, #1a1a2e 0%, #1e1e38 100%);
            border-top: 1px solid #2a2a45;
            padding: 12px 28px;
            flex-shrink: 0;
        }
        .player-inner {
            display: grid;
            grid-template-columns: 300px 1fr 180px;
            gap: 20px;
            align-items: center;
        }
        .now-playing {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }
        .cover {
            width: 52px; height: 52px;
            border-radius: 8px;
            object-fit: cover;
            background: linear-gradient(135deg, #a855f7, #6366f1);
            flex-shrink: 0;
        }
        .now-info { min-width: 0; }
        .now-title {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .now-artist {
            font-size: 12px;
            color: #8b8ba7;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .ctrl-btns {
            display: flex;
            align-items: center;
            gap: 18px;
        }
        .ctrl-btn {
            background: none;
            border: none;
            color: #b0b0c8;
            cursor: pointer;
            font-size: 18px;
            padding: 4px;
            transition: color 0.15s;
        }
        .ctrl-btn:hover { color: #fff; }
        .ctrl-btn.active { color: #c084fc; }
        .play-btn {
            width: 40px; height: 40px;
            background: #fff;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: #1a1a2e !important;
            font-size: 16px;
            transition: transform 0.15s;
        }
        .play-btn:hover { transform: scale(1.08); color: #1a1a2e !important; }
        .progress-row {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            max-width: 560px;
        }
        .time-text {
            font-size: 11px;
            color: #8b8ba7;
            min-width: 38px;
            text-align: center;
            font-variant-numeric: tabular-nums;
        }
        .progress-bar {
            flex: 1;
            height: 4px;
            background: #3a3a5c;
            border-radius: 2px;
            cursor: pointer;
            position: relative;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #a855f7, #6366f1);
            border-radius: 2px;
            width: 0%;
            position: relative;
        }
        .progress-fill::after {
            content: '';
            position: absolute;
            right: -6px;
            top: 50%;
            transform: translateY(-50%);
            width: 12px; height: 12px;
            background: #fff;
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.15s;
        }
        .progress-bar:hover .progress-fill::after { opacity: 1; }
        .volume-area {
            display: flex;
            align-items: center;
            gap: 8px;
            justify-content: flex-end;
        }
        .volume-btn {
            background: none;
            border: none;
            color: #b0b0c8;
            cursor: pointer;
            font-size: 16px;
        }
        .volume-bar {
            width: 90px;
            height: 4px;
            background: #3a3a5c;
            border-radius: 2px;
            cursor: pointer;
        }
        .volume-fill {
            height: 100%;
            background: #b0b0c8;
            border-radius: 2px;
            width: 70%;
        }

        /* 滚动条 */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: #3a3a5c; border-radius: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }

        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-80px);
            background: #2a2a45;
            color: #e8e8f0;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 14px;
            border: 1px solid #3a3a5c;
            z-index: 999;
            transition: transform 0.3s ease;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

<div class="top-bar">
    <div class="top-row">
        <div class="logo-area">
            <div class="logo-icon">🎵</div>
            <h1>听音乐</h1>
        </div>
        <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" placeholder="搜索歌曲、歌手..." autocomplete="off">
            <button class="search-btn" id="searchBtn">搜索</button>
        </div>
        <span class="source-tag">音源：网易云音乐</span>
    </div>
    <div class="hot-search" id="hotSearch">
        <span class="hot-label">🔥 热门搜索：</span>
    </div>
</div>

<div class="song-list-container" id="songListContainer">
    <div class="empty-state" id="emptyState">
        <div class="icon">🎶</div>
        <h3>搜索你喜欢的音乐</h3>
        <p>输入歌曲名或歌手名，点击搜索开始在线听歌</p>
    </div>
</div>

<div class="player-bar">
    <div class="player-inner">
        <div class="now-playing">
            <img class="cover" id="coverImg" src="">
            <div class="now-info">
                <div class="now-title" id="nowTitle">未播放</div>
                <div class="now-artist" id="nowArtist">--</div>
            </div>
        </div>
        <div class="controls">
            <div class="ctrl-btns">
                <button class="ctrl-btn" id="modeBtn" title="播放模式">🔁</button>
                <button class="ctrl-btn" id="prevBtn" title="上一首">⏮</button>
                <button class="ctrl-btn play-btn" id="playBtn" title="播放/暂停">▶</button>
                <button class="ctrl-btn" id="nextBtn" title="下一首">⏭</button>
                <button class="ctrl-btn" id="muteBtn" title="静音">🔊</button>
            </div>
            <div class="progress-row">
                <span class="time-text" id="curTime">0:00</span>
                <div class="progress-bar" id="progressBar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <span class="time-text" id="totalTime">0:00</span>
            </div>
        </div>
        <div class="volume-area">
            <div class="volume-bar" id="volumeBar">
                <div class="volume-fill" id="volumeFill"></div>
            </div>
        </div>
    </div>
</div>

<audio id="audio"></audio>
<div class="toast" id="toast"></div>

<script>
// ============ 配置 ============
const SEARCH_API = 'https://apis.netstart.cn/music/search';
const DETAIL_API = 'https://apis.netstart.cn/music/song/detail';
const SONG_URL = 'https://music.163.com/song/media/outer/url?id=';
const HOT_KEYWORDS = ['周杰伦','林俊杰','陈奕迅','邓紫棋','薛之谦','许嵩','Taylor Swift','华晨宇','李荣浩','Beyond'];

// ============ 状态 ============
let songs = [];
let currentIndex = -1;
let playMode = 0; // 0=顺序 1=随机 2=单曲循环
const audio = document.getElementById('audio');
audio.volume = 0.7;

// ============ DOM ============
const songListContainer = document.getElementById('songListContainer');
const emptyState = document.getElementById('emptyState');
const searchInput = document.getElementById('searchInput');
const searchBtn = document.getElementById('searchBtn');
const hotSearch = document.getElementById('hotSearch');
const playBtn = document.getElementById('playBtn');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const modeBtn = document.getElementById('modeBtn');
const muteBtn = document.getElementById('muteBtn');
const progressBar = document.getElementById('progressBar');
const progressFill = document.getElementById('progressFill');
const curTimeEl = document.getElementById('curTime');
const totalTimeEl = document.getElementById('totalTime');
const nowTitle = document.getElementById('nowTitle');
const nowArtist = document.getElementById('nowArtist');
const coverImg = document.getElementById('coverImg');
const volumeBar = document.getElementById('volumeBar');
const volumeFill = document.getElementById('volumeFill');
const toastEl = document.getElementById('toast');

// ============ 工具 ============
function showToast(msg, duration=2500){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(()=> toastEl.classList.remove('show'), duration);
}
function formatTime(ms){
    const sec = Math.floor(ms / 1000);
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return m + ':' + (s < 10 ? '0' : '') + s;
}
function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}

// ============ 热门搜索 ============
HOT_KEYWORDS.forEach(kw => {
    const tag = document.createElement('span');
    tag.className = 'hot-tag';
    tag.textContent = kw;
    tag.addEventListener('click', ()=>{
        searchInput.value = kw;
        doSearch();
    });
    hotSearch.appendChild(tag);
});

// ============ 搜索 ============
async function doSearch(){
    const keyword = searchInput.value.trim();
    if(!keyword) return;

    songListContainer.innerHTML = `
        <div class="loading-state">
            <div class="spinner"></div>
            <p>正在搜索"${escapeHtml(keyword)}"...</p>
        </div>`;

    try{
        const res = await fetch(`${SEARCH_API}?keywords=${encodeURIComponent(keyword)}&limit=30`);
        const data = await res.json();
        let list = data.result?.songs || [];

        if(list.length === 0){
            songListContainer.innerHTML = `
                <div class="empty-state">
                    <div class="icon">🔍</div>
                    <h3>没有找到相关歌曲</h3>
                    <p>试试其他关键词吧</p>
                </div>`;
            return;
        }

        // 批量获取详情（封面）
        try{
            const ids = list.map(s => s.id).join(',');
            const detailRes = await fetch(`${DETAIL_API}?ids=${ids}`);
            const detailData = await detailRes.json();
            const detailMap = {};
            (detailData.songs || []).forEach(s => {
                detailMap[s.id] = { picUrl: s.al?.picUrl || '', fee: s.fee };
            });
            list.forEach(s => {
                const d = detailMap[s.id];
                if(d){
                    s.picUrl = d.picUrl;
                    s.fee = d.fee;
                }
            });
        }catch(e){}

        songs = list;
        renderList();
    }catch(e){
        songListContainer.innerHTML = `
            <div class="empty-state">
                <div class="icon">⚠️</div>
                <h3>搜索失败</h3>
                <p>${escapeHtml(e.message)}<br>请检查网络后重试</p>
            </div>`;
    }
}

// ============ 渲染列表 ============
function renderList(){
    let html = `<div class="list-header">
        <span>#</span><span></span><span>标题</span><span>专辑</span><span style="text-align:right;">时长</span>
    </div>`;

    songs.forEach((song, i) => {
        const artists = (song.artists || song.ar || []).map(a => a.name).join(' / ') || '未知歌手';
        const album = song.album?.name || song.al?.name || '--';
        const isPlaying = i === currentIndex;
        const isVip = song.fee === 1;
        const cover = song.picUrl
            ? `<img class="song-cover" src="${song.picUrl}" loading="lazy" onerror="this.style.visibility='hidden'">`
            : `<div class="song-cover" style="display:flex;align-items:center;justify-content:center;font-size:18px;">🎵</div>`;

        html += `
        <div class="song-item ${isPlaying ? 'playing' : ''}" data-idx="${i}">
            <span class="song-index">${isPlaying && !audio.paused ? '<span class="playing-icon"><span></span><span></span><span></span></span>' : (i+1)}</span>
            ${cover}
            <div class="song-info">
                <div class="song-title">
                    ${escapeHtml(song.name)}
                    ${isVip ? '<span class="vip-badge">VIP</span>' : ''}
                </div>
                <div class="song-artist">${escapeHtml(artists)}</div>
            </div>
            <div class="song-album">${escapeHtml(album)}</div>
            <span class="song-duration">${song.duration ? formatTime(song.duration) : '--:--'}</span>
        </div>`;
    });

    songListContainer.innerHTML = html;

    songListContainer.querySelectorAll('.song-item').forEach(item => {
        item.addEventListener('click', ()=>{
            playSong(parseInt(item.dataset.idx));
        });
    });
}

// ============ 播放 ============
function playSong(idx){
    if(idx < 0 || idx >= songs.length) return;
    currentIndex = idx;
    const song = songs[idx];
    const artists = (song.artists || song.ar || []).map(a => a.name).join(' / ') || '未知歌手';
    const album = song.album?.name || song.al?.name || '';

    audio.src = SONG_URL + song.id + '.mp3';
    audio.play().then(()=>{
        updateNowPlaying(song, artists);
        renderList();
    }).catch(e=>{
        showToast('播放失败，可能是VIP歌曲或无版权，试试其他歌曲');
    });
}

function updateNowPlaying(song, artists){
    nowTitle.textContent = song.name;
    nowArtist.textContent = artists;
    if(song.picUrl){
        coverImg.src = song.picUrl;
        coverImg.style.display = '';
    } else {
        coverImg.removeAttribute('src');
        coverImg.style.display = 'flex';
        coverImg.style.alignItems = 'center';
        coverImg.style.justifyContent = 'center';
        coverImg.textContent = '🎵';
    }
}

function togglePlay(){
    if(currentIndex < 0){
        if(songs.length > 0) playSong(0);
        else showToast('请先搜索歌曲');
        return;
    }
    if(audio.paused) audio.play();
    else audio.pause();
}

function updatePlayBtn(){
    playBtn.textContent = audio.paused ? '▶' : '⏸';
}

function playPrev(){
    if(songs.length === 0) return;
    let idx;
    if(playMode === 1){
        idx = Math.floor(Math.random() * songs.length);
    } else {
        idx = (currentIndex - 1 + songs.length) % songs.length;
    }
    playSong(idx);
}

function playNext(){
    if(songs.length === 0) return;
    let idx;
    if(playMode === 1){
        idx = Math.floor(Math.random() * songs.length);
    } else {
        idx = (currentIndex + 1) % songs.length;
    }
    playSong(idx);
}

function cycleMode(){
    playMode = (playMode + 1) % 3;
    const icons = ['🔁', '🔀', '🔂'];
    const names = ['顺序播放', '随机播放', '单曲循环'];
    modeBtn.textContent = icons[playMode];
    modeBtn.classList.toggle('active', playMode !== 0);
    showToast(names[playMode]);
}

// ============ 事件 ============
searchBtn.addEventListener('click', doSearch);
searchInput.addEventListener('keydown', e => {
    if(e.key === 'Enter') doSearch();
});

playBtn.addEventListener('click', togglePlay);
prevBtn.addEventListener('click', playPrev);
nextBtn.addEventListener('click', playNext);
modeBtn.addEventListener('click', cycleMode);

audio.addEventListener('play', ()=>{ updatePlayBtn(); renderList(); });
audio.addEventListener('pause', ()=>{ updatePlayBtn(); renderList(); });
audio.addEventListener('ended', ()=>{
    if(playMode === 2){
        audio.currentTime = 0;
        audio.play();
    } else {
        playNext();
    }
});
audio.addEventListener('timeupdate', ()=>{
    if(audio.duration){
        progressFill.style.width = (audio.currentTime / audio.duration * 100) + '%';
        curTimeEl.textContent = formatTime(audio.currentTime * 1000);
    }
});
audio.addEventListener('loadedmetadata', ()=>{
    totalTimeEl.textContent = formatTime(audio.duration * 1000);
});
audio.addEventListener('error', ()=>{
    showToast('该歌曲无法播放（可能为VIP歌曲），自动播放下一首');
    setTimeout(()=> playNext(), 1500);
});

progressBar.addEventListener('click', e => {
    if(!audio.duration) return;
    const rect = progressBar.getBoundingClientRect();
    audio.currentTime = (e.clientX - rect.left) / rect.width * audio.duration;
});

let lastVolume = 0.7;
volumeBar.addEventListener('click', e => {
    const rect = volumeBar.getBoundingClientRect();
    const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    audio.volume = pct;
    volumeFill.style.width = (pct * 100) + '%';
    updateVolumeIcon(pct);
    lastVolume = pct;
});
function updateVolumeIcon(vol){
    if(vol === 0 || audio.muted) muteBtn.textContent = '🔇';
    else if(vol < 0.5) muteBtn.textContent = '🔉';
    else muteBtn.textContent = '🔊';
}
muteBtn.addEventListener('click', ()=>{
    if(audio.muted || audio.volume === 0){
        audio.muted = false;
        audio.volume = lastVolume || 0.7;
        volumeFill.style.width = (audio.volume * 100) + '%';
    } else {
        lastVolume = audio.volume;
        audio.muted = true;
        volumeFill.style.width = '0%';
    }
    updateVolumeIcon(audio.volume);
});

document.addEventListener('keydown', e => {
    if(e.target.tagName === 'INPUT') return;
    if(e.code === 'Space'){ e.preventDefault(); togglePlay(); }
    else if(e.ctrlKey && e.code === 'ArrowRight'){ playNext(); }
    else if(e.ctrlKey && e.code === 'ArrowLeft'){ playPrev(); }
});
</script>
</body>
</html>
