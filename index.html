<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>文件管理页面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, sans-serif;
        }
        body {
            max-width: 1000px;
            margin: 20px auto;
            padding: 0 20px;
        }
        .time-box {
            background:#222;
            color:#fff;
            padding:14px 20px;
            border-radius:8px;
            font-size:18px;
            margin-bottom:20px;
        }
        .search-area {
            margin-bottom:20px;
        }
        #search-input {
            width:100%;
            padding:12px 16px;
            font-size:16px;
            border: 2px solid #ccc;
            border-radius:8px;
        }
        .file-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .file-card {
            border: 2px solid #ccc;
            border-radius: 10px;
            padding: 16px 20px;
            background: #fff;
            transition: border-color 0.2s, box-shadow 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 14px;
        }
        .file-card:hover {
            border-color: #0066cc;
            box-shadow: 0 2px 8px rgba(0,102,204,0.15);
        }
        .card-note {
            font-size: 12px;
            color: #999;
            background: #f5f5f5;
            padding: 4px 10px;
            border-radius: 6px;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .empty-tip{
            text-align:center;
            padding:30px;
            color:#888;
            border: 2px dashed #ddd;
            border-radius: 10px;
        }
        .file-name-link{
            color:#0066cc;
            cursor:pointer;
            text-decoration:underline;
        }
        .modal-overlay{
            position:fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            background:rgba(0,0,0,0.5);
            display:none;
            align-items:center;
            justify-content:center;
            z-index:999;
        }
        .modal-box{
            background:#fff;
            width:90%;
            max-width:700px;
            max-height:80vh;
            border-radius:10px;
            padding:20px;
            display:flex;
            flex-direction:column;
        }
        .modal-header{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:12px;
        }
        .close-btn{
            border:none;
            background:#eee;
            padding:6px 12px;
            border-radius:6px;
            cursor:pointer;
        }
        .modal-content{
            white-space:pre-wrap;
            overflow:auto;
            min-height:200px;
            border:1px solid #ddd;
            padding:12px;
        }
    </style>
</head>
<body>
    <div class="time-box">
        当前时间：<span id="now-time"></span>
    </div>

    <div class="search-area">
        <input id="search-input" placeholder="输入文件名搜索...">
    </div>

    <div class="file-list" id="file-list">
        <div class="empty-tip">暂无文件</div>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <div class="modal-header">
                <h4 id="modalTitle">文件名</h4>
                <button class="close-btn" id="closeModal">关闭</button>
            </div>
            <div class="modal-content" id="modalBody"></div>
        </div>
    </div>

<script>
let fileList = [
    {
        name:"猜数字",
        time:"2026‑08‑15 22:10:00",
        content:"guess number",
        url:"/guess.html"
    },
    {
        name:"Python 编辑器",
        time:"2026‑08‑15 22:20:00",
        content:"浏览器中运行 Python 代码的在线编辑器",
        url:"/python_editor.html"
    },
    {
        name:"AI 助手",
        time:"2026‑08‑15 22:30:00",
        content:"智能问答助手，支持流式输出、Markdown渲染",
        url:"/ai_chat.html",
        note:"仅供deepseek有余额的人使用"
    },
    {
        name:"听音乐",
        time:"2026‑08‑16 12:30:00",
        content:"在线音乐播放器，支持QQ音乐、网易云音乐、汽水音乐搜索播放",
        url:"/music_player.html",
        note:"在线搜索播放，音源：QQ音乐 / 网易云音乐 / 汽水音乐"
    },
    {
        name:"棋类AI",
        time:"2026‑08‑17 10:00:00",
        content:"五子棋/围棋/中国象棋/国际象棋AI对弈，AI预判你的下一步",
        url:"/board_games.html",
        note:"AI学习你的棋路并预判走法"
    },
    {
        name:"同步复习助手",
        time:"2026‑08‑22 15:34:00",
        content:"同步课堂笔记、重点难点、作业批改与AI复习，支持拍照记录",
        url:"/同步复习助手.html"
    },
    {
        name:"翻译器",
        time:"2026‑08‑22 16:00:00",
        content:"支持100+语言互译，自动检测源语言，一键复制结果",
        url:"/translator.html"
    }
];

function updateTime(){
    const now = new Date();
    document.getElementById("now-time").innerText = now.toLocaleString();
}
setInterval(updateTime,1000);
updateTime();

function getTimeStamp(str){
    return new Date(str.replace(/‑/g,"/")).getTime();
}

function sortByTime(list){
    return list.sort((a,b)=> getTimeStamp(b.time) - getTimeStamp(a.time));
}

const modalOverlay = document.getElementById('modalOverlay');
const modalTitle = document.getElementById('modalTitle');
const modalBody = document.getElementById('modalBody');
document.getElementById('closeModal').addEventListener('click',()=>{
    modalOverlay.style.display = 'none';
})
modalOverlay.addEventListener('click',(e)=>{
    if(e.target === modalOverlay){
        modalOverlay.style.display = 'none';
    }
})

function openFileView(fileItem){
    if(fileItem.url){
        window.open(fileItem.url,"_blank");
        return;
    }
    modalTitle.innerText = fileItem.name;
    modalBody.innerText = fileItem.content;
    modalOverlay.style.display = 'flex';
}

function renderTable(data){
    const container = document.getElementById("file-list");
    container.innerHTML = "";
    if(data.length === 0){
        container.innerHTML = `<div class="empty-tip">暂无文件</div>`;
        return;
    }
    data.forEach(item=>{
        const card = document.createElement("div");
        card.className = "file-card";
        let noteHtml = item.note ? `<span class="card-note">${item.note}</span>` : '';
        card.innerHTML = `<span class="file-name-link">${item.name}</span>${noteHtml}`;
        card.querySelector('.file-name-link').addEventListener('click',()=>{
            openFileView(item);
        })
        container.appendChild(card);
    })
}

let sortedList = sortByTime([...fileList]);
renderTable(sortedList);

const searchInput = document.getElementById("search-input");
searchInput.addEventListener("input",function(){
    const keyword = this.value.trim().toLowerCase();
    const filter = sortedList.filter(f=> f.name.toLowerCase().includes(keyword));
    renderTable(filter);
})
</script>
</body>
</html>
