<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>电子课本</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI','Microsoft YaHei',sans-serif;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);color:#e0e0e0;min-height:100vh;}
.header{background:rgba(20,18,48,0.9);backdrop-filter:blur(12px);padding:12px 24px;display:flex;align-items:center;gap:16px;border-bottom:1px solid rgba(255,255,255,0.08);position:sticky;top:0;z-index:50;}
.header h1{font-size:20px;background:linear-gradient(135deg,#a78bfa,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.back-btn{background:rgba(167,139,250,0.15);border:1px solid rgba(167,139,250,0.3);color:#a78bfa;padding:6px 16px;border-radius:8px;cursor:pointer;font-size:13px;text-decoration:none;transition:all .2s;}
.back-btn:hover{background:rgba(167,139,250,0.25);}
.container{max-width:1200px;margin:20px auto;padding:0 16px;}

/* 筛选栏 */
.filter-bar{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:18px;margin-bottom:20px;display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;}
.filter-item{display:flex;flex-direction:column;gap:5px;flex:1;min-width:140px;position:relative;}
.filter-item label{font-size:12px;color:#a78bfa;font-weight:500;}
.combo-wrap{position:relative;}
.combo-input{width:100%;padding:9px 30px 9px 12px;border-radius:8px;border:1px solid rgba(167,139,250,0.3);background:rgba(20,18,48,0.8);color:#e0e0e0;font-size:14px;cursor:pointer;outline:none;}
.combo-input::placeholder{color:#666;}
.combo-input:focus{border-color:#a78bfa;box-shadow:0 0 10px rgba(167,139,250,0.2);cursor:text;}
.combo-arrow{position:absolute;right:10px;top:50%;transform:translateY(-50%);pointer-events:none;color:#a78bfa;font-size:10px;transition:transform .2s;}
.combo-wrap.open .combo-arrow{transform:translateY(-50%) rotate(180deg);}
.combo-list{position:absolute;top:calc(100% + 4px);left:0;right:0;max-height:280px;overflow-y:auto;background:#1a1740;border:1px solid rgba(167,139,250,0.3);border-radius:8px;z-index:60;display:none;box-shadow:0 8px 24px rgba(0,0,0,0.5);}
.combo-wrap.open .combo-list{display:block;}
.combo-opt{padding:8px 12px;font-size:13px;color:#ccc;cursor:pointer;transition:background .15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.combo-opt:hover,.combo-opt.active{background:rgba(167,139,250,0.2);color:#fff;}
.combo-opt.selected{color:#a78bfa;font-weight:600;}
.combo-opt.count{color:#666;font-size:11px;float:right;}
.combo-empty{padding:12px;text-align:center;color:#666;font-size:13px;}

/* 关键词搜索 */
.keyword-item{min-width:200px;flex:1.5;}
.keyword-input{width:100%;padding:9px 12px;border-radius:8px;border:1px solid rgba(167,139,250,0.3);background:rgba(20,18,48,0.8);color:#e0e0e0;font-size:14px;outline:none;}
.keyword-input:focus{border-color:#a78bfa;box-shadow:0 0 10px rgba(167,139,250,0.2);}
.keyword-input::placeholder{color:#666;}

.search-btn{padding:9px 28px;border-radius:8px;border:none;background:linear-gradient(135deg,#10b981,#059669);color:#fff;font-size:14px;font-weight:600;cursor:pointer;transition:all .25s;box-shadow:0 4px 12px rgba(16,185,129,0.3);white-space:nowrap;height:38px;}
.search-btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(16,185,129,0.4);}
.reset-btn{padding:9px 20px;border-radius:8px;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.05);color:#ccc;font-size:14px;cursor:pointer;transition:all .2s;height:38px;}
.reset-btn:hover{background:rgba(255,255,255,0.1);}

/* 结果统计 */
.result-info{font-size:13px;color:#888;margin-bottom:12px;padding:0 4px;}
.result-info span{color:#a78bfa;font-weight:600;}

/* 书籍网格 */
.book-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px;}
.book-card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:12px;overflow:hidden;cursor:pointer;transition:all .25s;display:flex;flex-direction:column;}
.book-card:hover{transform:translateY(-3px);border-color:rgba(167,139,250,0.4);box-shadow:0 8px 24px rgba(0,0,0,0.4);}
.book-cover{width:100%;aspect-ratio:3/4;background:rgba(0,0,0,0.3);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;}
.book-cover img{width:100%;height:100%;object-fit:cover;}
.book-cover .no-cover{font-size:36px;opacity:0.3;}
.book-info{padding:10px 12px;flex:1;display:flex;flex-direction:column;gap:3px;}
.book-title{font-size:13px;font-weight:600;color:#e0e0e0;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.book-meta{font-size:11px;color:#888;line-height:1.4;}
.book-pages{font-size:11px;color:#a78bfa;margin-top:auto;padding-top:4px;}

/* 加载和空状态 */
.loading,.empty{text-align:center;padding:60px 20px;color:#888;font-size:15px;}
.loading .spinner{display:inline-block;width:32px;height:32px;border:3px solid rgba(167,139,250,0.2);border-top-color:#a78bfa;border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:12px;}
@keyframes spin{to{transform:rotate(360deg);}}

/* 阅读器 - 翻书效果 */
.reader-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(10,8,25,0.98);z-index:100;display:none;flex-direction:column;}
.reader-overlay.active{display:flex;}
.reader-header{padding:10px 20px;display:flex;align-items:center;gap:14px;border-bottom:1px solid rgba(255,255,255,0.08);background:rgba(20,18,48,0.95);flex-shrink:0;}
.reader-header h2{font-size:15px;color:#e0e0e0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.reader-close{background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.3);color:#f87171;padding:6px 16px;border-radius:8px;cursor:pointer;font-size:13px;transition:all .2s;}
.reader-close:hover{background:rgba(239,68,68,0.25);}
.reader-body{flex:1;display:flex;align-items:center;justify-content:center;perspective:2000px;perspective-origin:center center;overflow:hidden;position:relative;padding:20px;}

.book{position:relative;transform-style:preserve-3d;}
.book-page{position:absolute;top:0;left:0;width:100%;height:100%;backface-visibility:hidden;border-radius:4px 8px 8px 4px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,0.5);}
.book-page img{width:100%;height:100%;object-fit:contain;display:block;background:#1a1a2e;}
.book-page.page-back{transform:rotateY(180deg);border-radius:8px 4px 4px 8px;}
.book-page.page-static{position:relative;z-index:1;}
.book-page.page-flipping{position:absolute;top:0;left:0;z-index:10;transform-origin:left center;}
.book-page.page-flipping.prev{transform-origin:right center;}

/* 书页阴影和渐变 */
.book-page::after{content:'';position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;border-radius:inherit;}
.page-front::after{background:linear-gradient(to right,rgba(0,0,0,0.15) 0%,transparent 5%,transparent 95%,rgba(0,0,0,0.1) 100%);}
.page-back::after{background:linear-gradient(to left,rgba(0,0,0,0.15) 0%,transparent 5%,transparent 95%,rgba(0,0,0,0.1) 100%);}

/* 翻页时的动态阴影 */
.flip-shadow{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:15;border-radius:4px;opacity:0;transition:opacity .3s;}
.flip-shadow.active{opacity:1;}

.reader-footer{padding:10px 20px;display:flex;align-items:center;justify-content:center;gap:16px;border-top:1px solid rgba(255,255,255,0.08);background:rgba(20,18,48,0.95);flex-shrink:0;flex-wrap:wrap;}
.page-btn{padding:8px 20px;border-radius:8px;border:1px solid rgba(167,139,250,0.3);background:rgba(167,139,250,0.1);color:#a78bfa;font-size:14px;cursor:pointer;transition:all .2s;}
.page-btn:hover:not(:disabled){background:rgba(167,139,250,0.25);}
.page-btn:disabled{opacity:0.3;cursor:not-allowed;}
.page-info{font-size:14px;color:#aaa;min-width:120px;text-align:center;}
.page-jump{display:flex;align-items:center;gap:6px;font-size:13px;color:#888;}
.page-jump input{width:60px;padding:5px 8px;border-radius:6px;border:1px solid rgba(255,255,255,0.15);background:rgba(0,0,0,0.3);color:#e0e0e0;font-size:13px;text-align:center;outline:none;}
.page-jump input:focus{border-color:#a78bfa;}
.page-jump button{padding:5px 12px;border-radius:6px;border:1px solid rgba(167,139,250,0.3);background:rgba(167,139,250,0.1);color:#a78bfa;font-size:12px;cursor:pointer;}
.page-jump button:hover{background:rgba(167,139,250,0.25);}

.page-loading{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#a78bfa;font-size:14px;z-index:5;display:flex;flex-direction:column;align-items:center;gap:10px;}
.page-loading .spinner{width:30px;height:30px;border:3px solid rgba(167,139,250,0.2);border-top-color:#a78bfa;border-radius:50%;animation:spin 0.8s linear infinite;}

.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:rgba(16,185,129,0.9);color:#fff;padding:10px 24px;border-radius:10px;font-size:14px;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none;}
.toast.show{opacity:1;}
</style>
</head>
<body>
<div class="header">
    <a href="/index.html" class="back-btn">← 返回</a>
    <h1>📚 电子课本</h1>
</div>
<div class="container">
    <div class="filter-bar">
        <div class="filter-item">
            <label>学段</label>
            <div class="combo-wrap" id="wrapStage">
                <input type="text" class="combo-input" id="fStage" placeholder="全部" autocomplete="off">
                <span class="combo-arrow">▼</span>
                <div class="combo-list"></div>
            </div>
        </div>
        <div class="filter-item">
            <label>年级</label>
            <div class="combo-wrap" id="wrapGrade">
                <input type="text" class="combo-input" id="fGrade" placeholder="全部" autocomplete="off">
                <span class="combo-arrow">▼</span>
                <div class="combo-list"></div>
            </div>
        </div>
        <div class="filter-item">
            <label>册次</label>
            <div class="combo-wrap" id="wrapVolume">
                <input type="text" class="combo-input" id="fVolume" placeholder="全部" autocomplete="off">
                <span class="combo-arrow">▼</span>
                <div class="combo-list"></div>
            </div>
        </div>
        <div class="filter-item">
            <label>学科</label>
            <div class="combo-wrap" id="wrapSubject">
                <input type="text" class="combo-input" id="fSubject" placeholder="全部" autocomplete="off">
                <span class="combo-arrow">▼</span>
                <div class="combo-list"></div>
            </div>
        </div>
        <div class="filter-item">
            <label>版本（出版社）</label>
            <div class="combo-wrap" id="wrapVersion">
                <input type="text" class="combo-input" id="fVersion" placeholder="全部" autocomplete="off">
                <span class="combo-arrow">▼</span>
                <div class="combo-list"></div>
            </div>
        </div>
        <div class="filter-item keyword-item">
            <label>搜索书名</label>
            <input type="text" class="keyword-input" id="fKeyword" placeholder="输入书名关键词，如：语文 七年级" autocomplete="off">
        </div>
        <button class="search-btn" id="searchBtn">搜索课本</button>
        <button class="reset-btn" id="resetBtn">重置</button>
    </div>
    <div class="result-info" id="resultInfo"></div>
    <div id="results">
        <div class="empty">请选择筛选条件或输入关键词后点击「搜索课本」</div>
    </div>
</div>

<!-- 阅读器 -->
<div class="reader-overlay" id="reader">
    <div class="reader-header">
        <h2 id="readerTitle"></h2>
        <button class="reader-close" id="readerClose">关闭</button>
    </div>
    <div class="reader-body" id="readerBody">
        <div class="book" id="book">
            <div class="book-page page-static" id="staticPage">
                <img id="staticImg" src="" alt="">
            </div>
        </div>
        <div class="page-loading" id="pageLoading" style="display:none;">
            <div class="spinner"></div>
            <span>翻页中...</span>
        </div>
    </div>
    <div class="reader-footer">
        <button class="page-btn" id="prevPage">← 上一页</button>
        <span class="page-info" id="pageInfo">0 / 0</span>
        <button class="page-btn" id="nextPage">下一页 →</button>
        <div class="page-jump">
            跳转到 <input type="number" id="jumpInput" min="1" value="1"> 页
            <button id="jumpBtn">Go</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script src="ebook_data.js"></script>
<script>
(function(){
    "use strict";

    var data = EBOOK_DATA;
    var $ = function(id){ return document.getElementById(id); };

    // 筛选值存储
    var filters = { stage:'', grade:'', volume:'', subject:'', version:'', keyword:'' };

    // 收集筛选选项
    function unique(arr){ return [...new Set(arr.filter(x=>x))].sort(); }
    var stages = unique(data.map(b=>b.s));
    var grades = unique(data.map(b=>b.g));
    var volumes = unique(data.map(b=>b.c));
    var subjects = unique(data.map(b=>b.k));
    var versions = unique(data.map(b=>b.v));

    function smartSort(arr, order){
        var sorted = [];
        order.forEach(function(g){
            arr.forEach(function(x){
                if(x.indexOf(g) >= 0 || g.indexOf(x) >= 0){
                    if(sorted.indexOf(x) < 0) sorted.push(x);
                }
            });
        });
        arr.forEach(function(x){ if(sorted.indexOf(x) < 0) sorted.push(x); });
        return sorted;
    }

    // 排序
    var sortedStages = smartSort(stages, ['小学','初中','高中','特殊教育']);
    var sortedGrades = smartSort(grades, ['一年级','二年级','三年级','四年级','五年级','六年级','七年级','八年级','九年级','高一年级','高二年级','高三年级']);
    var sortedVols = [];
    ['上册','下册','全一册'].forEach(function(v){
        volumes.forEach(function(x){ if(x===v && sortedVols.indexOf(x)<0) sortedVols.push(x); });
    });
    volumes.forEach(function(x){
        if(x.indexOf('必修')>=0 || x.indexOf('第')>=0 || x.indexOf('册')>=0){
            if(sortedVols.indexOf(x)<0) sortedVols.push(x);
        }
    });
    volumes.forEach(function(x){ if(sortedVols.indexOf(x)<0) sortedVols.push(x); });

    // ============ 可搜索下拉框组件 ============
    function initCombo(inputId, wrapId, options, filterKey){
        var input = $(inputId);
        var wrap = $(wrapId);
        var list = wrap.querySelector('.combo-list');
        var selected = '';

        function renderList(searchText){
            var filtered = options;
            if(searchText){
                var q = searchText.toLowerCase();
                filtered = options.filter(function(o){ return o.toLowerCase().indexOf(q) >= 0; });
            }
            list.innerHTML = '';
            // "全部"选项
            var allOpt = document.createElement('div');
            allOpt.className = 'combo-opt' + (selected==='' ? ' selected' : '');
            allOpt.innerHTML = '全部' + '<span class="count">' + data.length + '</span>';
            allOpt.addEventListener('mousedown', function(e){
                e.preventDefault();
                selected = '';
                input.value = '';
                filters[filterKey] = '';
                wrap.classList.remove('open');
                doSearch();
            });
            list.appendChild(allOpt);

            if(!filtered.length){
                var empty = document.createElement('div');
                empty.className = 'combo-empty';
                empty.textContent = '无匹配结果';
                list.appendChild(empty);
                return;
            }
            filtered.forEach(function(opt){
                var div = document.createElement('div');
                div.className = 'combo-opt' + (selected===opt ? ' selected' : '');
                div.textContent = opt;
                div.addEventListener('mousedown', function(e){
                    e.preventDefault();
                    selected = opt;
                    input.value = opt;
                    filters[filterKey] = opt;
                    wrap.classList.remove('open');
                    doSearch();
                });
                list.appendChild(div);
            });
        }

        input.addEventListener('focus', function(){
            wrap.classList.add('open');
            renderList(input.value);
        });
        input.addEventListener('input', function(){
            wrap.classList.add('open');
            renderList(input.value);
            // 输入时清除已选值
            if(input.value !== selected){
                selected = '';
                filters[filterKey] = '';
            }
        });
        input.addEventListener('keydown', function(e){
            if(e.key === 'Enter'){
                e.preventDefault();
                // 如果有过滤结果，选第一个匹配项
                var firstMatch = list.querySelector('.combo-opt:not(.selected)');
                if(firstMatch && input.value){
                    firstMatch.dispatchEvent(new MouseEvent('mousedown', {bubbles:true}));
                } else {
                    wrap.classList.remove('open');
                    doSearch();
                }
            }
            if(e.key === 'Escape'){
                wrap.classList.remove('open');
                input.value = selected;
            }
        });

        // 点击外部关闭
        document.addEventListener('click', function(e){
            if(!wrap.contains(e.target)){
                wrap.classList.remove('open');
                if(input.value !== selected){
                    input.value = selected;
                }
            }
        });

        return {
            reset: function(){ selected=''; input.value=''; filters[filterKey]=''; }
        };
    }

    var comboStage = initCombo('fStage','wrapStage', sortedStages, 'stage');
    var comboGrade = initCombo('fGrade','wrapGrade', sortedGrades, 'grade');
    var comboVolume = initCombo('fVolume','wrapVolume', sortedVols, 'volume');
    var comboSubject = initCombo('fSubject','wrapSubject', subjects, 'subject');
    var comboVersion = initCombo('fVersion','wrapVersion', versions, 'version');

    // ============ 搜索 ============
    function doSearch(){
        var kw = $('fKeyword').value.trim().toLowerCase();
        filters.keyword = kw;

        var results = data.filter(function(b){
            if(filters.stage && b.s !== filters.stage) return false;
            if(filters.grade && b.g !== filters.grade) return false;
            if(filters.volume && b.c !== filters.volume) return false;
            if(filters.subject && b.k !== filters.subject) return false;
            if(filters.version && b.v !== filters.version) return false;
            if(kw){
                var haystack = (b.t + ' ' + (b.s||'') + ' ' + (b.k||'') + ' ' + (b.v||'') + ' ' + (b.g||'') + ' ' + (b.c||'') + ' ' + (b.pub||'')).toLowerCase();
                if(haystack.indexOf(kw) < 0) return false;
            }
            return true;
        });

        renderResults(results);
    }

    function renderResults(books){
        var box = $('results');
        var info = $('resultInfo');

        if(!books.length){
            info.innerHTML = '';
            box.innerHTML = '<div class="empty">没有找到符合条件的课本，请调整筛选条件</div>';
            return;
        }

        info.innerHTML = '找到 <span>' + books.length + '</span> 本课本';

        box.innerHTML = '';
        var grid = document.createElement('div');
        grid.className = 'book-grid';

        books.forEach(function(b){
            var card = document.createElement('div');
            card.className = 'book-card';
            var coverHtml = b.th
                ? '<img src="' + b.th + '" alt="' + esc(b.t) + '" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display=\'none\';this.parentElement.innerHTML=\'<div class=no-cover>📕</div>\'">'
                : '<div class="no-cover">📕</div>';
            card.innerHTML =
                '<div class="book-cover">' + coverHtml + '</div>' +
                '<div class="book-info">' +
                    '<div class="book-title">' + esc(b.t) + '</div>' +
                    '<div class="book-meta">' + esc(b.s||'') + ' · ' + esc(b.k||'') + '</div>' +
                    '<div class="book-meta">' + esc(b.v||'') + (b.pub?' · '+esc(b.pub):'') + '</div>' +
                    (b.p>0 ? '<div class="book-pages">' + b.p + ' 页</div>' : '<div class="book-pages" style="color:#666">暂无预览</div>') +
                '</div>';
            card.addEventListener('click', function(){
                if(b.p>0 && b.b) openReader(b);
                else showToast('该课本暂无在线预览');
            });
            grid.appendChild(card);
        });

        box.appendChild(grid);
    }

    function esc(s){
        return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // ============ 阅读器（翻书效果） ============
    var readerBook = null;
    var currentPage = 1;
    var isFlipping = false;
    var flipDuration = 700; // ms

    // 预加载图片缓存
    var imgCache = {};
    function getImg(pageNum){
        if(imgCache[pageNum]) return imgCache[pageNum];
        var img = new Image();
        img.referrerPolicy = 'no-referrer';
        img.src = readerBook.b + pageNum + '.jpg';
        imgCache[pageNum] = img;
        return img;
    }

    function calcBookSize(){
        var body = $('readerBody');
        var maxH = body.clientHeight - 40;
        var maxW = body.clientWidth - 40;
        // 课本图片比例约 696:983
        var ratio = 696 / 983;
        var h = maxH;
        var w = h * ratio;
        if(w > maxW){ w = maxW; h = w / ratio; }
        return { w: Math.round(w), h: Math.round(h) };
    }

    function openReader(b){
        readerBook = b;
        currentPage = 1;
        isFlipping = false;
        imgCache = {};
        $('readerTitle').textContent = b.t + '（' + (b.s||'') + ' ' + (b.k||'') + ' ' + (b.v||'') + '）';
        $('reader').classList.add('active');
        // 预加载前3页
        [1,2,3].forEach(function(n){ if(n<=b.p) getImg(n); });
        setTimeout(function(){
            var size = calcBookSize();
            var book = $('book');
            book.style.width = size.w + 'px';
            book.style.height = size.h + 'px';
            renderStaticPage(1);
            updatePageInfo();
        }, 50);
    }

    function renderStaticPage(pageNum){
        var img = getImg(pageNum);
        var staticImg = $('staticImg');
        staticImg.src = img.src;
        staticImg.onerror = function(){
            this.style.opacity = '0.3';
            this.alt = '第' + pageNum + '页加载失败';
        };
    }

    function updatePageInfo(){
        var total = readerBook.p;
        $('pageInfo').textContent = currentPage + ' / ' + total;
        $('prevPage').disabled = currentPage <= 1 || isFlipping;
        $('nextPage').disabled = currentPage >= total || isFlipping;
        $('jumpInput').value = currentPage;
        $('jumpInput').max = total;
    }

    function flipTo(targetPage){
        if(isFlipping) return;
        if(targetPage < 1 || targetPage > readerBook.p) return;
        if(targetPage === currentPage) return;

        isFlipping = true;
        updatePageInfo();

        var direction = targetPage > currentPage ? 'next' : 'prev';
        var book = $('book');
        var size = calcBookSize();
        book.style.width = size.w + 'px';
        book.style.height = size.h + 'px';

        // 预加载目标页
        getImg(targetPage);
        if(targetPage < readerBook.p) getImg(targetPage + 1);
        if(targetPage > 1) getImg(targetPage - 1);

        // 创建翻转页
        var flipPage = document.createElement('div');
        flipPage.className = 'book-page page-flipping' + (direction === 'prev' ? ' prev' : '');
        flipPage.style.width = size.w + 'px';
        flipPage.style.height = size.h + 'px';

        // 正面（当前页）
        var front = document.createElement('div');
        front.className = 'book-page page-front';
        front.style.width = '100%';
        front.style.height = '100%';
        front.style.position = 'absolute';
        front.style.zIndex = '2';
        var frontImg = document.createElement('img');
        frontImg.src = getImg(currentPage).src;
        frontImg.referrerPolicy = 'no-referrer';
        frontImg.style.width = '100%';
        frontImg.style.height = '100%';
        frontImg.style.objectFit = 'contain';
        front.appendChild(frontImg);

        // 背面（目标页）
        var back = document.createElement('div');
        back.className = 'book-page page-back';
        back.style.width = '100%';
        back.style.height = '100%';
        back.style.position = 'absolute';
        back.style.zIndex = '1';
        var backImg = document.createElement('img');
        backImg.src = getImg(targetPage).src;
        backImg.referrerPolicy = 'no-referrer';
        backImg.style.width = '100%';
        backImg.style.height = '100%';
        backImg.style.objectFit = 'contain';
        back.appendChild(backImg);

        // 阴影层
        var shadow = document.createElement('div');
        shadow.className = 'flip-shadow';
        shadow.style.background = direction === 'next'
            ? 'linear-gradient(to left, rgba(0,0,0,0.4) 0%, transparent 40%)'
            : 'linear-gradient(to right, rgba(0,0,0,0.4) 0%, transparent 40%)';

        flipPage.appendChild(back);
        flipPage.appendChild(front);
        flipPage.appendChild(shadow);
        book.appendChild(flipPage);

        // 底层先显示目标页（翻完后露出的页面）
        renderStaticPage(targetPage);

        // 强制reflow后开始动画
        void flipPage.offsetWidth;

        if(direction === 'next'){
            flipPage.style.transformOrigin = 'left center';
            flipPage.style.transition = 'transform ' + flipDuration + 'ms ease-in-out';
            flipPage.style.transform = 'rotateY(-180deg)';
        } else {
            flipPage.style.transformOrigin = 'right center';
            flipPage.style.transition = 'transform ' + flipDuration + 'ms ease-in-out';
            flipPage.style.transform = 'rotateY(180deg)';
        }

        // 阴影渐变
        setTimeout(function(){ shadow.classList.add('active'); }, 50);
        setTimeout(function(){ shadow.classList.remove('active'); }, flipDuration - 200);

        // 动画结束
        setTimeout(function(){
            flipPage.remove();
            currentPage = targetPage;
            isFlipping = false;
            renderStaticPage(currentPage);
            updatePageInfo();
        }, flipDuration + 20);
    }

    function goNext(){
        if(currentPage < readerBook.p && !isFlipping) flipTo(currentPage + 1);
    }
    function goPrev(){
        if(currentPage > 1 && !isFlipping) flipTo(currentPage - 1);
    }

    $('prevPage').addEventListener('click', goPrev);
    $('nextPage').addEventListener('click', goNext);
    $('jumpBtn').addEventListener('click', function(){
        var n = parseInt($('jumpInput').value);
        if(n >= 1 && n <= readerBook.p && n !== currentPage) flipTo(n);
    });
    $('jumpInput').addEventListener('keydown', function(e){
        if(e.key === 'Enter') $('jumpBtn').click();
    });
    $('readerClose').addEventListener('click', function(){
        $('reader').classList.remove('active');
        readerBook = null;
        isFlipping = false;
    });

    // 键盘翻页
    document.addEventListener('keydown', function(e){
        if(!$('reader').classList.contains('active')) return;
        if(e.key === 'ArrowLeft') goPrev();
        if(e.key === 'ArrowRight') goNext();
        if(e.key === 'Escape') $('readerClose').click();
    });

    // 窗口大小变化时重新计算
    window.addEventListener('resize', function(){
        if(!readerBook || !$('reader').classList.contains('active')) return;
        var size = calcBookSize();
        var book = $('book');
        book.style.width = size.w + 'px';
        book.style.height = size.h + 'px';
    });

    // ============ 按钮事件 ============
    $('searchBtn').addEventListener('click', doSearch);
    $('resetBtn').addEventListener('click', function(){
        comboStage.reset();
        comboGrade.reset();
        comboVolume.reset();
        comboSubject.reset();
        comboVersion.reset();
        $('fKeyword').value = '';
        filters.keyword = '';
        $('results').innerHTML = '<div class="empty">请选择筛选条件或输入关键词后点击「搜索课本」</div>';
        $('resultInfo').innerHTML = '';
    });

    // 关键词回车搜索
    $('fKeyword').addEventListener('keydown', function(e){
        if(e.key === 'Enter') doSearch();
    });

    function showToast(msg){
        var t = $('toast');
        t.textContent = msg;
        t.className = 'toast show';
        setTimeout(function(){ t.className = 'toast'; }, 2000);
    }

    $('resultInfo').innerHTML = '共收录 <span>' + data.length + '</span> 本课本，选择条件或输入关键词后自动搜索';
})();
</script>
</body>
</html>
